apiVersion: 1
datasources:
- name: ClickHouse
  type: grafana-clickhouse-datasource
  jsonData:
    defaultDatabase: default
    port: 9000
    host: clickhouse
    username: user
    tlsSkipVerify: false
    logs:
      defaultDatabase: default
      defaultTable: otel_logs
      otelEnabled: true
  secureJsonData:
    password: pass
