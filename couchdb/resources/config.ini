[chttpd]
authentication_handlers = {chttpd_auth, proxy_authentication_handler}, {chttpd_auth, cookie_authentication_handler}, {chttpd_auth, default_authentication_handler}
enable_cors = true
bind_address = any

[chttpd_auth]
hash_algorithms = sha256
proxy_use_secret = true

[cors]
credentials = true
headers = accept, authorization, content-type, origin, referer, quickpage_id, X-Auth-CouchDB-Token, X-Auth-CouchDB-UserName
methods = GET, PUT, POST, HEAD, DELETE, OPTIONS
origins = https://quickpage.naaraanhq.com

[couchdb]
uuid = 670ea758f2d3051cc8f728bfe47fa4ef

[cluster]
n = 3
q = 2
seedlist = couchdb@couchdb-0.couchdb-cluster.couchdb.svc.cluster.local,couchdb@couchdb-1.couchdb-cluster.couchdb.svc.cluster.local,couchdb@couchdb-2.couchdb-cluster.couchdb.svc.cluster.local
