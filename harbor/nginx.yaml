apiVersion: v1
kind: ConfigMap
metadata:
  name: dockerhub-proxy-nginx
data:
  default.conf: |
    server {
        listen 8080;
        server_name harbor-hub.vongjon.com;

        location ~ ^/v2/(?<path>.*)$ {
            if ($path != "") {
                # inject project and source domain into uri
                set $path "hub/$path";
            }

            proxy_pass            https://harbor.vongjon.com/v2/$path;
            proxy_cache           off;
            proxy_set_header      Host                            $http_host;   # required for docker client's sake
            proxy_set_header      X-Real-IP                       $remote_addr; # pass on real client's IP
            proxy_set_header      X-Forwarded-For                 $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto               $scheme;
            proxy_read_timeout    900;
            # prepare delegate auth
            proxy_hide_header     Www-Authenticate;
        }
        location ~ ^/service/ {
            if ($args ~* "^(.*)(scope=repository%3A)(.*)$") {
                # inject project and source domain into the auth scope
                set $args "$1$2hub%2F$3";
            }
            proxy_pass            https://harbor.vongjon.com$uri$is_args$args;
            proxy_cache           off;
            proxy_set_header      Host                            $http_host;   # required for docker client's sake
            proxy_set_header      X-Real-IP                       $remote_addr; # pass on real client's IP
            proxy_set_header      X-Forwarded-For                 $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto               $scheme;
            proxy_read_timeout    900;
        }

    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - image: nginx:latest
        name: nginx
        ports:
        - containerPort: 8080
          name: tcp-nginx
        volumeMounts:
        - mountPath: "/etc/nginx/templates/default.conf.template"
          subPath: "default.conf"
          name: dockerhub-proxy-nginx
      volumes:
      - name: "dockerhub-proxy-nginx"
        configMap:
          name: dockerhub-proxy-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
    app: nginx
  type: ClusterIP
  ports:
  - name: nginx
    protocol: TCP
    port: 80
    targetPort: 8080
