---
# tasks that run after a new deployment

- name: Install AD Domain packages
  apt: 
    name: "{{ item }}"
    state: present 
    update_cache: yes
  vars:
    item:
    - sssd-ad
    - sssd-tools
    - realmd
    - adcli
    - samba-common-bin
  tags: ad

