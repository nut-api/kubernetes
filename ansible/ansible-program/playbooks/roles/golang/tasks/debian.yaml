- name: check go command
  command: which go
  register: go_check
  failed_when: no
  changed_when: no

- block:
  - name: Download go
    get_url: url="https://go.dev/dl/go1.23.2.linux-amd64.tar.gz"
      dest="/opt/go1.23.2.linux-amd64.tar.gz"

  - name: Extract the downloaded file
    command: tar -xvzf /opt/go1.23.2.linux-amd64.tar.gz -C /usr/local

  - name: Remove go packaged
    ansible.builtin.file:
      path: /opt/go1.23.2.linux-amd64.tar.gz
      state: absent

  - name: Source go in profile
    lineinfile: >
      dest=/etc/profile line="export PATH=$PATH:/usr/local/go/bin" create=yes

  when: go_check.rc != 0
