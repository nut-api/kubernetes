- name: remove swap
  shell: "swapoff -a; sed -i '/swap/d' /etc/fstab"

- name: br netfillter
  become: true
  shell: |
    cat <<EOF | sudo tee /etc/modules-load.d/k8s.conf
    br_netfilter
    EOF

- name: letting iptables
  become: true
  shell: |
    cat <<EOF | sudo tee /etc/sysctl.d/k8s.conf
    net.bridge.bridge-nf-call-ip6tables = 1
    net.bridge.bridge-nf-call-iptables = 1
    EOF

- name: apply sysctl params
  become: true
  shell: "sysctl --system"

- name: install APT Transport HTTPS
  apt:
    name: apt-transport-https
    state: present

- name: Add Kubernetes apt repo
  block:
  - name: Create keyrings directory if it does not exist
    ansible.builtin.file:
      path: /etc/apt/keyrings
      state: directory
      mode: '0755'

  - name: Add apt key
    apt_key:
      url: https://pkgs.k8s.io/core:/stable:/{{kubeadm_version}}/deb/Release.key
      keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      state: present

  - name: Remove old repo list file
    ansible.builtin.file:
      path: /etc/apt/sources.list.d/kubernetes.list
      state: absent

  - name: Add Kubernetes's apt repository
    apt_repository:
      repo: deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{kubeadm_version}}/deb/ /
      state: present
      filename: kubernetes


- name: install kubelet
  apt:
    name: kubelet
    state: present
    update_cache: true

- name: Hold kubelet
  dpkg_selections:
    name: kubelet
    selection: hold

- name: install kubeadm
  apt:
    name: kubeadm
    state: present

- name: Hold kubeadm
  dpkg_selections:
    name: kubeadm
    selection: hold

- name: install kubectl
  apt:
    name: kubectl
    state: present
