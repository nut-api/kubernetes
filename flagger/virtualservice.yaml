apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: podinfo-public
spec:
  hosts:
    - "app.vongjon.com"
  gateways:
    - istio-system/gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: podinfo
            port:
              number: 9898