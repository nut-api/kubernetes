apiVersion: batch/v1
kind: CronJob
metadata:
  name: "script-cronjob"
spec:
  schedule: "15 1 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          name: "script-cronjob"
        spec:
          restartPolicy: Never
          containers:
          - name: runscript
            image: bitnami/kubectl
            command:
            - /bin/sh
            - -c
            - |
              kubectl logs -l app=istiod --tail=100
          serviceAccountName: script-cronjob
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: script-cronjob
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: script-cronjob
rules:
- apiGroups: [ "" ]
  resources: [ "pods", "pods/log" ]
  verbs: [ "get", "list", "create" ]
---
apiVersion: rbac.authorization.k8s.io/v1
# This role binding allows "jane" to read pods in the "default" namespace.
# You need to already have a Role named "pod-reader" in that namespace.
kind: RoleBinding
metadata:
  name: script-cronjob
subjects:
# You can specify more than one "subject"
- kind: ServiceAccount
  name: script-cronjob # "name" is case sensitive
roleRef:
  # "roleRef" specifies the binding to a Role / ClusterRole
  kind: Role #this must be Role or ClusterRole
  name: script-cronjob # this must match the name of the Role or ClusterRole you wish to bind to
  apiGroup: rbac.authorization.k8s.io
