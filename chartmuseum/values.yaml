replicaCount: 2
env:
  existingSecret: helm-repo-1
  existingSecretMappings:
    BASIC_AUTH_USER: user
    BASIC_AUTH_PASS: pass
    AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
  open:
    DISABLE_API: false
    STORAGE: amazon
    STORAGE_AMAZON_BUCKET: helm-repo
    STORAGE_AMAZON_ENDPOINT: s3.us-west-004.backblazeb2.com
    STORAGE_AMAZON_PREFIX: ""