
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vongjon-let-staging
  namespace: istio-system
spec:
  secretName: vongjon-let-staging
  duration: 2160h
  renewBefore: 360h
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - client auth
  dnsNames:
    - "vongjon.com"
    - "foundation.vongjon.com"
    - "authen.vongjon.com"
    - "grafana.vongjon.com"
  issuerRef:
    name: letsencrypt-staging-cluster
    kind: ClusterIssuer
    group: cert-manager.io