apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: digisense-io-prod
spec:
  secretName: digisense-io-prod
  issuerRef:
    name: letsencrypt-prod-dns
    kind: ClusterIssuer
  commonName: '*.digisense.io'
  dnsNames:
  - "*.digisense.io"
  - "*.digisense-site.com"
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-dns
  namespace: cert-manager
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: 'nut@apiplustech.com'
    privateKeySecretRef:
      name: letsencrypt-prod-dns
    solvers:
    - dns01:
        cloudflare:
          email: nut@apiplustech.com
          apiKeySecretRef:
            name: cloudflare-api-key-secret
            key: api-key
      selector:
        dnsZones:
        - 'digisense.io'
        - '*.digisense.io'
        - 'digisense-site.com'
        - '*.digisense-site.com'
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-key-secret
  namespace: cert-manager
type: Opaque
stringData:
  api-key: 0020b8221eb9e2d27a033201cb2bd0f68b07c
---
