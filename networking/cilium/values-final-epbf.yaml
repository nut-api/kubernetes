bpf:
  #   hostLegacyRouting: false
  masquerade: true
cluster:
  name: production-server
cni:
  exclusive: true
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
    - 172.20.0.0/16
operator:
  replicas: 1
  unmanagedPodWatcher:
    restart: true
policyEnforcementMode: default
# routingMode: "native"
# ipv4NativeRoutingCIDR: "172.20.0.0/16"
# tunnelPort: 8473
# tunnelProtocol: vxlan
kubeProxyReplacement: true
k8sServiceHost: 10.0.0.100
k8sServicePort: 6443
socketLB:
  hostNamespaceOnly: true
